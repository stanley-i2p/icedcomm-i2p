name: Release builds

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build artifacts only or create a draft GitHub release
        required: true
        default: build-only
        type: choice
        options:
          - build-only
          - draft-release
      release_tag:
        description: Optional for build-only; required for draft-release (for example, v1.0.1)
        required: false
        type: string
      prerelease:
        description: Mark a created draft release as a prerelease
        required: true
        default: false
        type: boolean

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release metadata
        id: metadata
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          version="$(
            cargo metadata \
              --manifest-path Cargo.toml \
              --no-deps \
              --locked \
              --format-version 1 \
              | jq -r '.packages[] | select(.name == "icedcomm-i2p") | .version'
          )"

          if [[ -z "$version" || "$version" == "null" ]]; then
            echo "Unable to read icedcomm-i2p version from Cargo.toml." >&2
            exit 1
          fi

          server_version="$(
            cargo metadata \
              --manifest-path SERVER/Cargo.toml \
              --no-deps \
              --locked \
              --format-version 1 \
              | jq -r '.packages[] | select(.name == "deaddrop-server") | .version'
          )"

          if [[ -z "$server_version" || "$server_version" == "null" ]]; then
            echo "Unable to read deaddrop-server version from SERVER/Cargo.toml." >&2
            exit 1
          fi

          if [[ "$server_version" != "$version" ]]; then
            echo "Client version '$version' and server version '$server_version' do not match." >&2
            exit 1
          fi

          expected_tag="v${version}"
          release_tag="${REQUESTED_TAG:-$expected_tag}"

          if [[ "$release_tag" != "$expected_tag" ]]; then
            echo "Release tag '$release_tag' does not match Cargo.toml version '$expected_tag'." >&2
            exit 1
          fi

          if [[ "$REQUESTED_MODE" == "draft-release" ]]; then
            if [[ -z "${REQUESTED_TAG:-}" ]]; then
              echo "release_tag is required when creating a draft release." >&2
              exit 1
            fi

            if ! git show-ref --verify --quiet "refs/tags/$release_tag"; then
              echo "Tag '$release_tag' does not exist. Create it before running draft-release." >&2
              exit 1
            fi

            tag_commit="$(git rev-list -n 1 "$release_tag")"
            selected_commit="$(git rev-parse HEAD)"
            if [[ "$tag_commit" != "$selected_commit" ]]; then
              echo "Tag '$release_tag' does not point to the selected workflow revision." >&2
              exit 1
            fi
          fi

          artifact_name="icedcomm-i2p-${release_tag}-linux-x86_64"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            file \
            desktop-file-utils \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Build release binaries
        run: |
          cargo build --release --locked --manifest-path Cargo.toml
          cargo build --release --locked --manifest-path SERVER/Cargo.toml

      - name: Download verified AppImage tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-tools

          curl --fail --location --retry 3 \
            --output .release-tools/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  .release-tools/appimagetool.AppImage" \
            | sha256sum --check --strict

          curl --fail --location --retry 3 \
            --output .release-tools/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  .release-tools/runtime-x86_64" \
            | sha256sum --check --strict

          chmod 755 .release-tools/appimagetool.AppImage
          (
            cd .release-tools
            ./appimagetool.AppImage --appimage-extract >/dev/null
          )

      - name: Package Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          bash scripts/package-linux.sh \
            "${{ steps.metadata.outputs.version }}" \
            "$GITHUB_WORKSPACE/.release-tools/squashfs-root/AppRun" \
            "$GITHUB_WORKSPACE/.release-tools/runtime-x86_64"
          bash scripts/package-server-linux.sh \
            "${{ steps.metadata.outputs.version }}"

          (
            cd dist
            sha256sum \
              "icedcomm-i2p-${{ steps.metadata.outputs.release_tag }}-linux-x86_64.AppImage" \
              "icedcomm-i2p-${{ steps.metadata.outputs.release_tag }}-linux-x86_64.tar.gz" \
              "deaddrop-server-${{ steps.metadata.outputs.release_tag }}-linux-x86_64.tar.gz" \
              > SHA256SUMS
          )

      - name: Validate packaged artifacts
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/icedcomm-i2p-${{ steps.metadata.outputs.release_tag }}-linux-x86_64.tar.gz"
          appimage="dist/icedcomm-i2p-${{ steps.metadata.outputs.release_tag }}-linux-x86_64.AppImage"
          server_archive="dist/deaddrop-server-${{ steps.metadata.outputs.release_tag }}-linux-x86_64.tar.gz"
          server_package="deaddrop-server-${{ steps.metadata.outputs.release_tag }}-linux-x86_64"

          test -s "$archive"
          test -x "$appimage"
          test -s "$server_archive"
          desktop-file-validate packaging/linux/icedcomm-i2p.desktop
          file target/release/icedcomm-i2p | grep -Eq 'ELF 64-bit.*x86-64'
          ! ldd target/release/icedcomm-i2p | grep -q 'not found'
          file SERVER/target/release/deaddrop-server | grep -Eq 'ELF 64-bit.*x86-64'
          ! ldd SERVER/target/release/deaddrop-server | grep -q 'not found'

          mkdir -p .appimage-check
          (
            cd .appimage-check
            "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null
          )
          test -x .appimage-check/squashfs-root/usr/bin/icedcomm-i2p
          test -f .appimage-check/squashfs-root/icedcomm-i2p.desktop
          test -f .appimage-check/squashfs-root/commtools-i2p.png
          grep -qx 'Exec=icedcomm-i2p' .appimage-check/squashfs-root/icedcomm-i2p.desktop
          grep -qx 'Icon=commtools-i2p' .appimage-check/squashfs-root/icedcomm-i2p.desktop

          mkdir -p .server-check
          tar -xzf "$server_archive" -C .server-check
          test -x ".server-check/$server_package/deaddrop-server"
          test -f ".server-check/$server_package/README.md"
          test -f ".server-check/$server_package/LICENSE"
          test -f ".server-check/$server_package/NOTICE"

          (
            cd dist
            sha256sum --check SHA256SUMS
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read and validate release metadata
        id: metadata
        shell: pwsh
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"

          $clientJson = cargo metadata `
            --manifest-path Cargo.toml `
            --no-deps `
            --locked `
            --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read client Cargo metadata."
          }

          $clientMetadata = $clientJson | ConvertFrom-Json
          $clientPackage = $clientMetadata.packages |
            Where-Object { $_.name -eq "icedcomm-i2p" } |
            Select-Object -First 1
          if ($null -eq $clientPackage) {
            throw "Unable to read icedcomm-i2p version from Cargo.toml."
          }
          $version = [string]$clientPackage.version

          $serverJson = cargo metadata `
            --manifest-path SERVER/Cargo.toml `
            --no-deps `
            --locked `
            --format-version 1
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read server Cargo metadata."
          }

          $serverMetadata = $serverJson | ConvertFrom-Json
          $serverPackage = $serverMetadata.packages |
            Where-Object { $_.name -eq "deaddrop-server" } |
            Select-Object -First 1
          if ($null -eq $serverPackage) {
            throw "Unable to read deaddrop-server version from SERVER/Cargo.toml."
          }
          $serverVersion = [string]$serverPackage.version

          if ($serverVersion -ne $version) {
            throw "Client version '$version' and server version '$serverVersion' do not match."
          }

          $expectedTag = "v$version"
          $requestedTag = [string]$env:REQUESTED_TAG
          $releaseTag = if ([string]::IsNullOrWhiteSpace($requestedTag)) {
            $expectedTag
          } else {
            $requestedTag
          }

          if ($releaseTag -ne $expectedTag) {
            throw "Release tag '$releaseTag' does not match Cargo.toml version '$expectedTag'."
          }

          if ($env:REQUESTED_MODE -eq "draft-release") {
            if ([string]::IsNullOrWhiteSpace($requestedTag)) {
              throw "release_tag is required when creating a draft release."
            }

            git show-ref --verify --quiet "refs/tags/$releaseTag"
            if ($LASTEXITCODE -ne 0) {
              throw "Tag '$releaseTag' does not exist. Create it before running draft-release."
            }

            $tagCommit = (git rev-list -n 1 $releaseTag).Trim()
            $selectedCommit = (git rev-parse HEAD).Trim()
            if ($tagCommit -ne $selectedCommit) {
              throw "Tag '$releaseTag' does not point to the selected workflow revision."
            }
          }

          $artifactName = "icedcomm-i2p-$releaseTag-windows-x86_64"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_tag=$releaseTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path SERVER/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows artifacts
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.metadata.outputs.version }}"

      - name: Validate packaged artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function Assert-X64Pe([string]$Path) {
            $stream = [System.IO.File]::OpenRead($Path)
            $reader = New-Object System.IO.BinaryReader($stream)
            try {
              if ($reader.ReadUInt16() -ne 0x5A4D) {
                throw "Not a Windows PE executable: $Path"
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Invalid PE signature: $Path"
              }
              if ($reader.ReadUInt16() -ne 0x8664) {
                throw "Executable is not Windows x86_64: $Path"
              }
            } finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          $releaseTag = "${{ steps.metadata.outputs.release_tag }}"
          $clientArchive = "dist\icedcomm-i2p-$releaseTag-windows-x86_64.zip"
          $serverArchive = "dist\deaddrop-server-$releaseTag-windows-x86_64.zip"
          $clientBinary = "target\release\icedcomm-i2p.exe"
          $serverBinary = "SERVER\target\release\deaddrop-server.exe"

          foreach ($required in @($clientArchive, $serverArchive, $clientBinary, $serverBinary, "dist\SHA256SUMS")) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required Windows artifact is missing: $required"
            }
          }

          Assert-X64Pe $clientBinary
          Assert-X64Pe $serverBinary

          Remove-Item -LiteralPath ".windows-check" -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $clientArchive -DestinationPath ".windows-check\client"
          Expand-Archive -LiteralPath $serverArchive -DestinationPath ".windows-check\server"

          $clientPackage = ".windows-check\client\icedcomm-i2p-$releaseTag-windows-x86_64"
          $serverPackage = ".windows-check\server\deaddrop-server-$releaseTag-windows-x86_64"
          foreach ($required in @(
            "$clientPackage\icedcomm-i2p.exe",
            "$clientPackage\README.md",
            "$clientPackage\LICENSE",
            "$clientPackage\NOTICE",
            "$serverPackage\deaddrop-server.exe",
            "$serverPackage\README.md",
            "$serverPackage\LICENSE",
            "$serverPackage\NOTICE"
          )) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required file is missing from Windows package: $required"
            }
          }

          foreach ($line in Get-Content -LiteralPath "dist\SHA256SUMS") {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split "  ", 2
            if ($parts.Count -ne 2) {
              throw "Invalid checksum line: $line"
            }
            $artifactPath = Join-Path "dist" $parts[1]
            $actual = (Get-FileHash -LiteralPath $artifactPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $parts[0].ToLowerInvariant()) {
              throw "Checksum mismatch for '$($parts[1])'."
            }
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  create-draft-release:
    name: Create draft release
    if: ${{ inputs.mode == 'draft-release' }}
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Check out selected revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download Linux build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-linux.outputs.artifact_name }}
          path: .release-input/linux

      - name: Download Windows build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-windows.outputs.artifact_name }}
          path: .release-input/windows

      - name: Revalidate release inputs
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.build-linux.outputs.release_tag }}
          WINDOWS_RELEASE_TAG: ${{ needs.build-windows.outputs.release_tag }}
          VERSION: ${{ needs.build-linux.outputs.version }}
          WINDOWS_VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "$WINDOWS_RELEASE_TAG"
          test "$VERSION" = "$WINDOWS_VERSION"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          (
            cd .release-input/linux
            sha256sum --check SHA256SUMS
          )
          (
            cd .release-input/windows
            sha256sum --check SHA256SUMS
          )

          rm -rf dist
          mkdir -p dist
          cp .release-input/linux/*.AppImage dist/
          cp .release-input/linux/*.tar.gz dist/
          cp .release-input/windows/*.zip dist/
          (
            cd dist
            sha256sum *.AppImage *.tar.gz *.zip > SHA256SUMS
          )

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build-linux.outputs.release_tag }}
          VERSION: ${{ needs.build-linux.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "A GitHub release already exists for '$RELEASE_TAG'. Refusing to overwrite it." >&2
            exit 1
          fi

          args=(
            "$RELEASE_TAG"
            --verify-tag
            --draft
            --generate-notes
            --title "IcedComm-I2P $VERSION"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh release create "${args[@]}" dist/*
